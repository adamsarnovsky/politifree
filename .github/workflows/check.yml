name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/community.cjs
      - run: node tests/community-background.cjs
      - run: node tests/classifier.cjs
      - run: python3 scripts/build.py
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Python discovery and repair on Windows PowerShell
        shell: powershell
        run: ./tests/installer.ps1
